name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - media/**
      - .github/workflows/pages.yml

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install mdBook
        run: |
          curl -fsSL -o /tmp/mdbook.tgz \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.3/mdbook-v0.5.3-x86_64-unknown-linux-musl.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar xz -C "$HOME/.local/bin" -f /tmp/mdbook.tgz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Stage images for mdBook
        # mdBook only copies files under docs/src, so repository images have to
        # be staged there before the build. Mirrors `just docs`.
        run: |
          rm -rf docs/src/media
          cp -R media docs/src/media

      - name: Build docs
        run: mdbook build docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
